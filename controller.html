<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vissenkom Controller</title>

    <!-- iOS Safari adresbalk kleur -->
    <meta name="theme-color" content="#0b1e2d">
    <meta name="theme-color" content="#0b1e2d" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1e2d" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#0b1e2d">
    <link rel="stylesheet" href="css/controller.css">
</head>
<body>
    <div class="controller-container">
        <h1>🐟 Vissenkom Controller</h1>

        <!-- Vis toevoegen: de reden om te scannen, dus bovenaan -->
        <div class="category-section" id="addFishSection">
            <h3 class="section-header section-header--fish">🐟 Vis toevoegen</h3>
            <div class="add-fish-container">
                <input type="text" id="fishNameInput" placeholder="Naam van je visje..." disabled>
                <button id="addFishBtn" class="control-button fish-button add-fish-btn" disabled>
                    🐟 Toevoegen
                </button>
            </div>
        </div>

        <!-- Verzorging: alles wat de vissen in leven houdt -->
        <div class="category-section">
            <h3 class="section-header section-header--care">❤️ Verzorging</h3>
            <div class="controls-grid tile-grid">
                <button id="feedBtn" class="control-button care-button" disabled>
                    <span class="tile-emoji">🍤</span>Voeren<span class="btn-note" id="feedNote"></span>
                </button>
                <button id="medicineBtn" class="control-button care-button" disabled>
                    <span class="tile-emoji">💊</span>Medicijn<span class="btn-note" id="medicineNote"></span>
                </button>
                <button id="cleanBtn" class="control-button care-button" disabled>
                    <span class="tile-emoji">💩</span>Poep opruimen<span class="btn-note" id="cleanNote"></span>
                </button>
                <button id="refreshWaterBtn" class="control-button care-button" disabled>
                    <span class="tile-emoji">💧</span>Water verversen<span class="btn-note" id="waterNote"></span>
                </button>
            </div>
        </div>

        <!-- Spelen en de kom: ingeklapt, zodat je eerst alleen ziet wat ertoe doet -->
        <details class="more-section" id="moreSection">
            <summary class="more-summary"><span class="when-closed">Meer ▾</span><span class="when-open">Minder ▴</span></summary>

            <div class="category-section">
                <h3 class="section-header section-header--play">🎮 Spelen</h3>
                <div class="controls-grid tile-grid">
                    <button id="tapGlassBtn" class="control-button play-button" disabled>
                        <span class="tile-emoji">👆</span>Tikken
                    </button>
                    <button id="playBallBtn" class="control-button play-button" disabled>
                        <span class="tile-emoji">🎾</span>Bal gooien
                    </button>
                    <button id="fishingRodBtn" class="control-button play-button" disabled>
                        <span class="tile-emoji">🎣</span>Hengelen
                    </button>
                    <button id="raceBtn" class="control-button play-button" disabled>
                        <span class="tile-emoji">🏁</span>Race
                    </button>
                    <button id="partyBtn" class="control-button play-button" disabled>
                        <span class="tile-emoji">💃</span>Dansen
                    </button>
                </div>

                <!-- Race selectie -->
                <div id="raceSelection" class="race-selection" style="display: none;">
                    <h3 class="section-header section-header--play">Kies twee vissen voor de race</h3>
                    <div class="race-dropdowns">
                        <select id="raceFish1" class="race-select" disabled>
                            <option value="">Kies vis 1...</option>
                        </select>
                        <span class="race-vs">VS</span>
                        <select id="raceFish2" class="race-select" disabled>
                            <option value="">Kies vis 2...</option>
                        </select>
                    </div>
                    <div class="race-actions">
                        <button id="startRaceBtn" class="control-button play-button" disabled>
                            🏁 Start!
                        </button>
                        <button id="cancelRaceBtn" class="control-button cancel-button">
                            ✕ Annuleren
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kom: schakelaars die laten zien hoe het nu staat -->
            <div class="category-section">
                <h3 class="section-header section-header--tank">🏠 Kom</h3>
                <div class="toggle-list">
                    <button id="lightBtn" class="toggle-row" role="switch" aria-checked="false" disabled>
                        <span class="toggle-name">💡 Licht</span><span class="toggle-state">-</span><span class="switch"></span>
                    </button>
                    <button id="heatingBtn" class="toggle-row" role="switch" aria-checked="false" disabled>
                        <span class="toggle-name">🔥 Verwarming</span><span class="toggle-state">-</span><span class="switch"></span>
                    </button>
                    <button id="pumpBtn" class="toggle-row" role="switch" aria-checked="false" disabled>
                        <span class="toggle-name">💨 Pomp</span><span class="toggle-state">-</span><span class="switch"></span>
                    </button>
                    <button id="discoBtn" class="toggle-row" role="switch" aria-checked="false" disabled>
                        <span class="toggle-name">🎉 Disco</span><span class="toggle-state">-</span><span class="switch"></span>
                    </button>
                </div>
            </div>

            <!-- Over de kom: om te lezen, niet om te doen; pas opgehaald als je Meer opent -->
            <div class="category-section" id="historySection">
                <h3 class="section-header section-header--history">🐠 Over de kom</h3>
                <div class="history-block">
                    <h4>📍 Nu in de kom</h4>
                    <div class="now-chips" id="nowList"></div>
                </div>
                <div class="history-block">
                    <h4>🕐 Laatste activiteiten</h4>
                    <ul class="history-list" id="historyActivity"></ul>
                    <button id="historyActivityMore" class="history-more" hidden></button>
                </div>
                <div class="history-block">
                    <h4>⭐ Sterren van de kom</h4>
                    <ol class="history-list" id="historyStars"></ol>
                </div>
                <div class="history-block" id="historyMemorialBlock" hidden>
                    <h4 id="historyMemorialTitle">💙 In onze harten</h4>
                    <ul class="history-list" id="historyMemorial"></ul>
                    <button id="historyMemorialMore" class="history-more" hidden></button>
                </div>
            </div>
        </details>
    </div>

    <div class="version-display">
        <div class="version-qr-container">
            <div class="version-line">
                Vissenkom v<span id="versionNumber">...</span>
            </div>
            <div class="qr-line">
                <span id="qrValidityStatus" class="qr-validity-status"><span id="qrValidityIcon">🔓</span><span class="qr-label"> QR-code geldigheid:</span> <span id="qrValidityText">geldig</span></span>
            </div>
        </div>
        <div id="footerText" style="text-align: center; margin-top: 10px; opacity: 0.6; font-size: 0.85em;">
        </div>
    </div>

    <script src="js/activity.js"></script>
    <script src="js/controller.js"></script>
</body>
</html>
